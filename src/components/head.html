<!--
  Reusable <head> partial for Bitcoin Đà Nẵng.
  Copy into each page's <head> (no build step yet - Phase 6 build.js will inline this).
  Replace {{TITLE}} and {{DESCRIPTION}} per page.
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0D0D0D" />
<title>{{TITLE}} - Bitcoin Đà Nẵng</title>
<meta name="description" content="{{DESCRIPTION}}" />

<!-- Open Graph -->
<meta property="og:title" content="{{TITLE}} - Bitcoin Đà Nẵng" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:image" content="/images/og-default.jpg" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://bitcoindanang.com" />
<meta name="twitter:card" content="summary_large_image" />

<!-- Canonical: self-referential per page. Replace {{CANONICAL_URL}} with the
     page's absolute URL (e.g. https://bitcoindanang.com/ for the homepage). -->
<link rel="canonical" href="{{CANONICAL_URL}}" />

<!-- Structured data: site-wide Organization + WebSite (truthful; safe on every page) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://bitcoindanang.com/#organization",
      "name": "Bitcoin Đà Nẵng",
      "url": "https://bitcoindanang.com",
      "logo": "https://bitcoindanang.com/images/logo.png",
      "description": "Cộng đồng Bitcoin đầu tiên tại Đà Nẵng, Việt Nam. Gặp gỡ hàng tháng, thân thiện với người mới.",
      "sameAs": ["https://t.me/+4VDDldma_CRkZWU1"]
    },
    {
      "@type": "WebSite",
      "@id": "https://bitcoindanang.com/#website",
      "name": "Bitcoin Đà Nẵng",
      "url": "https://bitcoindanang.com",
      "inLanguage": "vi",
      "publisher": { "@id": "https://bitcoindanang.com/#organization" }
    }
  ]
}
</script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<!-- Favicon (placeholder) -->
<link rel="icon" type="image/png" href="/images/logo.png" />

<!-- Styles -->
<link rel="stylesheet" href="/src/styles/tokens.css" />
<link rel="stylesheet" href="/src/styles/base.css" />
<link rel="stylesheet" href="/src/styles/components.css" />
